server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Hỗ trợ React Router (SPA) khi reload hoặc truy cập trực tiếp route
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache tài nguyên tĩnh (JS, CSS, ảnh, font) để tăng tốc độ tải
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Tắt log không cần thiết cho favicon
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}